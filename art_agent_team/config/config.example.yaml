# neural-canvas — configuration template
# Copy to config.yaml and fill in real values. config.yaml is gitignored —
# NEVER commit real secrets. Keys may instead be exported as environment
# variables; main.py promotes the *_api_key entries below into the env at startup.
# Placeholder values (anything starting with "YOUR_") are detected and skipped.

# ── LLM / vision API keys ───────────────────────────────────────────────
grok_api_key: "YOUR_GROK_API_KEY_HERE"             # xAI Grok — core identify/vision/placard text
openrouter_api_key: "YOUR_OPENROUTER_API_KEY_HERE" # OpenRouter — research fallback aggregator
openai_api_key: "YOUR_OPENAI_API_KEY_HERE"         # OpenAI — optional
google_api_key: "YOUR_GOOGLE_API_KEY_HERE"         # Google Gemini (generative AI)
google_credentials_path: ""                        # GCP service-account JSON path (Vertex/Vision; optional)

# ── Google Custom Search (artwork identification: web / reverse lookup) ──
google_search_api_key: "YOUR_GOOGLE_SEARCH_API_KEY_HERE"
google_search_engine_id: "YOUR_CSE_ENGINE_ID_HERE"

# ── Upscaling ───────────────────────────────────────────────────────────
upscaler_preference: "fallback"                    # image_upscaling_net | stability_ai | fallback | local_esrgan
stablediffusion_api_key: "YOUR_STABILITY_API_KEY_HERE"   # Stability AI fast upscaler
image_upscaling_id: "YOUR_IMAGE_UPSCALING_CLIENT_ID_HERE" # image-upscaling.net client id

# ── Vertex AI (optional alternate backend; guarded — leave blank if unused) ──
vertex_project_id: ""
vertex_location: ""

# ── Folders ─────────────────────────────────────────────────────────────
input_folder: "input"
output_folder: "output"
workspace_folder: "workspace"

# ── Pipeline knobs ──────────────────────────────────────────────────────
cleanup_workspace: true
max_concurrent_calls: 5        # ResearchAgent parallel vision-model calls
llm_call_timeout: 120          # seconds per vision-model call

# ── Identification (cost-aware; favors local/free per project decision D) ──
identification:
  engine: "local_first"        # local_first | vlm_only | api_cross_check
  ollama_url: "http://localhost:11434"
  vision_model: "qwen3-vl:8b"  # local Ollama vision model (free)
  catalog_enabled: true        # local CLIP/SigLIP + Qdrant catalog cross-check
  reverse_image_api: ""        # optional paid signal (serpapi | tineye); blank = disabled

# ── Placard ─────────────────────────────────────────────────────────────
placard_agent:
  width_fraction: 0.25         # placard width as a fraction of artwork width (museum label ~20–30%)
  opacity: 0.9
  position: "lower-right"
  font_path: ""                # custom TrueType font (optional)

# ── Delivery: Google Photos (set up via OAuth — joint step E) ───────────
google_photos:
  oauth_client_path: ""        # OAuth 2.0 client JSON (created in Google Cloud console)
  album_name: "neural-canvas"  # app-owned album; scope: photoslibrary.appendonly
